name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the fields below so we can reproduce and fix it quickly.

  - type: input
    id: version
    attributes:
      label: "@bonniepdf/core version"
      placeholder: "e.g. 1.2.3"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Browser (ESM)
        - Node.js (ESM)
        - Node.js (CommonJS)
        - Bundler (Vite / webpack / esbuild)
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Paste the smallest snippet of code that triggers the bug.
      render: typescript
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected output / behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual output / error
      description: Include the full error message and stack trace if available.
