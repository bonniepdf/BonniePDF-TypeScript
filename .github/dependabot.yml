version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      dev-tools:
        patterns:
          - turbo
          - tsup
          - typescript
          - "@changesets/*"
          - "@types/*"
    ignore:
      # Keep @bonniepdf/* updates manual (published from this repo)
      - dependency-name: "@bonniepdf/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
