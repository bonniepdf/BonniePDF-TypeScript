name: Release

# Releases are cut by pushing a version tag:
#
#   git tag v2026.7.3 && git push origin v2026.7.3
#
# Version numbers are decided by the estate's versioning tool, not by this
# workflow and not by a bump derived from commit messages, so the tag is the
# single source of truth for what is being published. workflow_dispatch is
# kept for re-running a release that failed after the tag was already pushed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      validate_only:
        description: Verify source and npm trusted publishing without publishing
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Publish to npm
    if: inputs.validate_only || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The environment's name is part of the identity npm trusted publishing
    # checks; `deployment: false` keeps it without recording a deployment, so
    # a failed run does not leave a failed "production" deployment behind.
    environment:
      name: production
      deployment: false
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm OIDC trusted publishing + provenance attestation

    steps:
      # Asks npm, before publishing, whether this run matches the package's
      # trusted publisher. A mismatch otherwise surfaces only as E404 on
      # publish. Prints the identity npm sees, never the token.
      - name: Check npm trusted publishing
        env:
          PACKAGE: "@bonniepdf/core"
        run: |
          set -euo pipefail
          echo "Checking $PACKAGE from $GITHUB_REPOSITORY (repository ID $GITHUB_REPOSITORY_ID)."
          id_token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          status=$(curl -sS -o exchange.json -w '%{http_code}' -X POST -H "Authorization: Bearer $id_token" "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${PACKAGE/\//%2f}")
          accepted=false
          if [[ "$status" == 2* ]] && jq -e .token exchange.json > /dev/null 2>&1; then accepted=true; fi
          rm -f exchange.json
          if $accepted; then
            echo "npm accepts this run as a trusted publisher for $PACKAGE."
            exit 0
          fi
          payload=$(cut -d. -f2 <<< "$id_token" | tr '_-' '/+')
          while (( ${#payload} % 4 )); do payload+='='; done
          claims=$(base64 -d <<< "$payload" 2>/dev/null || echo '{}')
          echo "::error::npm does not accept this run as a trusted publisher for $PACKAGE (HTTP $status)."
          echo "On npmjs.com, open $PACKAGE, then Settings, then Trusted publishing, and make the GitHub Actions entry match exactly. The fields are case-sensitive:"
          jq -r '"  Organization or user: \(.repository_owner)", "  Repository: \(.repository | split("/")[1])", "  Workflow filename: \(.workflow_ref | split("@")[0] | split("/") | last)", "  Environment: \(.environment // "(leave blank)")"' <<< "$claims" || true
          echo "Then re-run this job."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require cross-engine gallery validation
        if: ${{ !inputs.validate_only }}
        env:
          GH_TOKEN: ${{ secrets.PARITY_WORKFLOW_TOKEN }}
          PARITY_WORKFLOW_REPOSITORY: ${{ vars.PARITY_WORKFLOW_REPOSITORY }}
          GALLERY_ENGINE: typescript
        run: bash scripts/verify-gallery-gate.sh

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo build

      - name: Verify package types for Node16/NodeNext consumers
        run: pnpm --filter @bonniepdf/core run check:consumer-types

      # The tag is authoritative. If the manifest disagrees with it, the wrong
      # thing is about to be published, so stop rather than guess which is right.
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./core/package.json').version")
          echo "tag: $TAG_VERSION   package.json: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo ""
            echo "ERROR: tag $GITHUB_REF_NAME does not match @bonniepdf/core $PKG_VERSION."
            echo "Set the version with the versioning tool, commit, then tag."
            exit 1
          fi

      # Publishes with npm OIDC trusted publishing: no long-lived NPM_TOKEN,
      # and provenance is attested from this workflow's identity.
      - name: Publish to npm
        if: ${{ !inputs.validate_only }}
        run: pnpm publish --filter @bonniepdf/core --access public --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      # The changelog is hand-maintained, so the section for this version is
      # already written by the time the tag exists. Lift it into the release
      # body rather than regenerating notes from commits.
      - name: Extract release notes from CHANGELOG.md
        if: ${{ !inputs.validate_only && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="## $VERSION" '
            $0 == v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No '## $VERSION' section in CHANGELOG.md; releasing without notes."
            echo "See CHANGELOG.md." > release-notes.md
          fi
          cat release-notes.md

      - name: Create GitHub release
        if: ${{ !inputs.validate_only && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=()
          if grep -Fxq 'Status: Prerelease' release-notes.md; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag "${flags[@]}" \
            --repo "${{ github.repository }}" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
