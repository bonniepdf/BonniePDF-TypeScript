name: Feature request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What are you trying to do that isn't currently possible?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed API / solution
      description: How would you like to use this feature? A code sketch is ideal.
      render: typescript

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds have you tried?

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Important — blocking a use-case
        - Critical — blocking adoption
