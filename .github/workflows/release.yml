name: Release

# Releases are cut by pushing a version tag:
#
#   git tag v2026.7.3 && git push origin v2026.7.3
#
# Version numbers are decided by the estate's versioning tool, not by this
# workflow and not by a bump derived from commit messages, so the tag is the
# single source of truth for what is being published. workflow_dispatch is
# kept for re-running a release that failed after the tag was already pushed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm OIDC trusted publishing + provenance attestation
      actions: write # delete prior workflow runs

    steps:
      # Delete this workflow's prior runs before doing anything else, so the
      # Actions tab only ever shows the current run. Best-effort: never block
      # the release if the cleanup API call hiccups.
      - name: Delete prior workflow runs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list \
            --repo "${{ github.repository }}" \
            --workflow release.yml \
            --json databaseId \
            --jq '.[].databaseId' \
            --limit 100 \
          | grep -v '^${{ github.run_id }}$' \
          | xargs -r -I{} gh run delete --repo "${{ github.repository }}" {}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require cross-engine gallery validation
        env:
          GH_TOKEN: ${{ secrets.PARITY_WORKFLOW_TOKEN }}
          PARITY_WORKFLOW_REPOSITORY: ${{ vars.PARITY_WORKFLOW_REPOSITORY }}
          GALLERY_ENGINE: typescript
        run: bash scripts/verify-gallery-gate.sh

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo build

      # The tag is authoritative. If the manifest disagrees with it, the wrong
      # thing is about to be published, so stop rather than guess which is right.
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./core/package.json').version")
          echo "tag: $TAG_VERSION   package.json: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo ""
            echo "ERROR: tag $GITHUB_REF_NAME does not match @bonniepdf/core $PKG_VERSION."
            echo "Set the version with the versioning tool, commit, then tag."
            exit 1
          fi

      # Publishes with npm OIDC trusted publishing: no long-lived NPM_TOKEN,
      # and provenance is attested from this workflow's identity.
      - name: Publish to npm
        run: pnpm publish --filter @bonniepdf/core --access public --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      # The changelog is hand-maintained, so the section for this version is
      # already written by the time the tag exists. Lift it into the release
      # body rather than regenerating notes from commits.
      - name: Extract release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="## $VERSION" '
            $0 == v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No '## $VERSION' section in CHANGELOG.md; releasing without notes."
            echo "See CHANGELOG.md." > release-notes.md
          fi
          cat release-notes.md

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "${{ github.repository }}" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
