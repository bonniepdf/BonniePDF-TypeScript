name: PDF Conformance Validation

# Compliance gate: builds the library, generates the tagged example PDFs, and
# validates every claimed PDF/A and PDF/UA conformance level with veraPDF. The job fails if any PDF
# is non-compliant (tools/verapdf/validate.sh exits non-zero), so a regression
# cannot reach master. See docs/ci/pdf-validation.md.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  validate:
    name: Generate & validate claimed conformance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # JDK + Maven power the veraPDF gate (tools/verapdf).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # Avoids re-resolving the veraPDF engine from Maven Central and
      # recompiling Validate.java on every run.
      - name: Cache veraPDF engine
        uses: actions/cache@v4
        with:
          path: |
            tools/verapdf/lib
            tools/verapdf/Validate.class
          key: verapdf-${{ runner.os }}-${{ hashFiles('tools/verapdf/pom.xml', 'tools/verapdf/Validate.java') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo build

      # The example set is derived from the shared registry (examples/src/index.ts):
      # every example with `pdfUa1: true` (and no password) is generated and
      # validated, so new examples are picked up automatically — no edit here.
      - name: Generate tagged example PDFs
        run: pnpm generate-tagged

      - name: Validate with veraPDF (auto-detected claims)
        run: tools/verapdf/validate.sh generated-pdfs auto

      - name: Upload generated PDFs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-pdfs
          path: generated-pdfs/
          retention-days: 14

      # Self-contained card report: the HTML plus the first-page SVG previews it
      # references via relative <img src>. Both must travel together for the
      # thumbnails to render when the artifact is downloaded.
      - name: Upload conformance report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: |
            generated-pdfs/verapdf-report.html
            generated-pdfs/*.svg
          retention-days: 14
          if-no-files-found: ignore

      - name: Delete prior workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list \
            --repo "${{ github.repository }}" \
            --workflow validate-accessibility.yml \
            --json databaseId \
            --jq '.[].databaseId' \
            --limit 100 \
          | grep -v '^${{ github.run_id }}$' \
          | xargs -r -I{} gh run delete --repo "${{ github.repository }}" {}
