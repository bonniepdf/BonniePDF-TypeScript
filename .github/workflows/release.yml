name: Release

on:
  push:
    branches: [master]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write        # push version-bump commits and create releases
      pull-requests: write   # create and update the "Version Packages" PR
      id-token: write        # npm provenance attestation

    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets needs full history to determine what changed
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo build

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          # When changesets exist → open/update "Version Packages" PR
          # When that PR is merged → publish to npm
          version: pnpm changeset version
          publish: pnpm changeset publish
          title: "chore: release packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
