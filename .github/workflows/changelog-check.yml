name: Changelog check

on:
  pull_request:
    branches: [master]

permissions:
  contents: read # checkout
  actions: write # delete prior workflow runs

jobs:
  changelog:
    name: Require changelog entry for core changes
    runs-on: ubuntu-latest
    steps:
      # Delete this workflow's prior runs before doing anything else, so the
      # Actions tab only ever shows the current run. Best-effort: never block
      # the real job if the cleanup API call hiccups.
      - name: Delete prior workflow runs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list \
            --repo "${{ github.repository }}" \
            --workflow changelog-check.yml \
            --json databaseId \
            --jq '.[].databaseId' \
            --limit 100 \
          | grep -v '^${{ github.run_id }}$' \
          | xargs -r -I{} gh run delete --repo "${{ github.repository }}" {}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # CHANGELOG.md is maintained by hand (see the file's own header). A change
      # to core/ is a change to the published package, so it has to be
      # described for the people who consume it.
      - name: Require a changelog entry when core is modified
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if ! echo "$CHANGED" | grep -q '^core/'; then
            echo "No core/ changes — changelog entry not required."
            exit 0
          fi

          echo "Changes detected in core/ — checking for a changelog entry..."
          if ! echo "$CHANGED" | grep -q '^CHANGELOG\.md$'; then
            echo ""
            echo "ERROR: core/ was modified but CHANGELOG.md was not."
            echo "Add an entry under '## Unreleased' describing the change."
            exit 1
          fi

          # Guard against CHANGELOG.md being touched anywhere *except* the
          # Unreleased section (for example only renaming a released heading).
          if ! git diff origin/${{ github.base_ref }}...HEAD -- CHANGELOG.md \
               | grep -qE '^\+[^+]'; then
            echo ""
            echo "ERROR: CHANGELOG.md changed but added no lines."
            echo "Add an entry under '## Unreleased' describing the change."
            exit 1
          fi
          echo "Changelog entry found. ✓"

      # Both public repos publish their working docs. Internal roadmap and
      # api-gap identifiers mean nothing to an outside reader and must not
      # appear in shipped text.
      - name: Reject internal identifiers in the changelog
        run: |
          if grep -nE '\b(G-[0-9]{1,3}|T-[0-9]{2})\b' CHANGELOG.md; then
            echo ""
            echo "ERROR: CHANGELOG.md references internal ticket identifiers."
            echo "Describe the change itself; this repository is public."
            exit 1
          fi
          echo "No internal identifiers. ✓"
