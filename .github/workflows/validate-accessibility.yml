name: PDF Conformance Validation

# Compliance gate: builds the library, generates the conformance fixtures, and
# validates every claimed PDF/A and PDF/UA conformance level with veraPDF. The job fails if any PDF
# is non-compliant (tools/verapdf/validate.sh exits non-zero), so a regression
# cannot reach master. See docs/ci/pdf-validation.md.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  validate:
    name: Generate & validate claimed conformance
    runs-on: ubuntu-latest

    steps:
      # Delete this workflow's prior runs before doing anything else, so the
      # Actions tab only ever shows the current run. Best-effort: never block
      # the real job if the cleanup API call hiccups.
      - name: Delete prior workflow runs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list \
            --repo "${{ github.repository }}" \
            --workflow validate-accessibility.yml \
            --json databaseId \
            --jq '.[].databaseId' \
            --limit 100 \
          | grep -v '^${{ github.run_id }}$' \
          | xargs -r -I{} gh run delete --repo "${{ github.repository }}" {}

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # JDK + Maven power the veraPDF gate (tools/verapdf).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # Avoids re-resolving the veraPDF engine from Maven Central and
      # recompiling Validate.java on every run.
      - name: Cache veraPDF engine
        uses: actions/cache@v6
        with:
          path: |
            tools/verapdf/lib
            tools/verapdf/Validate.class
          key: verapdf-${{ runner.os }}-${{ hashFiles('tools/verapdf/pom.xml', 'tools/verapdf/Validate.java') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo build

      # The authoring-time gate, run before the file-level one because it is fast
      # (no Java, no veraPDF download) and because it reports which *element* is
      # at fault rather than which object number. Fails on error severity only —
      # contrast findings are warnings and must not block a build over a
      # deliberately styled examples.
      - name: Accessibility preflight over the example catalogue
        run: pnpm check:preflight

      # The example set is derived from the shared registry (examples/src/index.ts):
      # every example with `pdfUa1: true` (and no password) is generated, along
      # with the mandatory PDF/A-4 baseline fixture.
      - name: Generate conformance PDFs
        run: pnpm generate-tagged

      - name: Verify hand-written fixtures are present
        run: |
          test -s generated-pdfs/pdfa1b_baseline.pdf
          test -s generated-pdfs/pdfa1a_baseline.pdf
          test -s generated-pdfs/pdfa3a_baseline.pdf
          test -s generated-pdfs/pdfa4_baseline.pdf
          test -s generated-pdfs/factur-x_invoice.pdf

      # Fail fast with a clear message if validate.sh lost its executable bit
      # (mode 100644 instead of 100755) - otherwise the validate step below
      # dies with an opaque exit-126 "Permission denied". See
      # docs/developer/ci/workflow-maintenance.
      - name: Verify validate.sh is executable
        run: |
          mode=$(git ls-files -s tools/verapdf/validate.sh | cut -d' ' -f1)
          if [ "$mode" != "100755" ]; then
            echo "::error::tools/verapdf/validate.sh has mode $mode, expected 100755. Fix with: git update-index --chmod=+x tools/verapdf/validate.sh"
            exit 1
          fi

      - name: Validate with veraPDF (auto-detected claims)
        run: tools/verapdf/validate.sh generated-pdfs auto

      # ── ZUGFeRD / Factur-X gate (Mustang) ────────────────────────────────
      # veraPDF proves PDF/A-3b; Mustang additionally validates the embedded
      # CII XML against the EN 16931 schematron. PDF/A passing alone is not a
      # valid e-invoice claim. This mirrors the same gate in the .NET repo, so
      # the two implementations are held to the same e-invoice bar.
      - name: Cache Mustang CLI
        uses: actions/cache@v6
        with:
          path: tools/mustang/*.jar
          key: mustang-${{ runner.os }}-${{ hashFiles('tools/mustang/validate.sh') }}

      - name: Verify mustang validate.sh is executable
        run: |
          mode=$(git ls-files -s tools/mustang/validate.sh | cut -d' ' -f1)
          if [ "$mode" != "100755" ]; then
            echo "::error::tools/mustang/validate.sh has mode $mode, expected 100755. Fix with: git update-index --chmod=+x tools/mustang/validate.sh"
            exit 1
          fi

      - name: Validate ZUGFeRD / Factur-X with Mustang
        run: tools/mustang/validate.sh generated-pdfs/factur-x_invoice.pdf

      - name: Upload generated PDFs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: generated-pdfs
          path: generated-pdfs/
          retention-days: 14
