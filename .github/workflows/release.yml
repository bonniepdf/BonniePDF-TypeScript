name: Release

on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write        # push version-bump commits and create releases
      pull-requests: write   # create and update the "Version Packages" PR
      id-token: write        # npm provenance attestation
      actions: write         # delete prior workflow runs

    steps:
      # Delete this workflow's prior runs before doing anything else, so the
      # Actions tab only ever shows the current run. Best-effort: never block
      # the release if the cleanup API call hiccups.
      - name: Delete prior workflow runs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list \
            --repo "${{ github.repository }}" \
            --workflow release.yml \
            --json databaseId \
            --jq '.[].databaseId' \
            --limit 100 \
          | grep -v '^${{ github.run_id }}$' \
          | xargs -r -I{} gh run delete --repo "${{ github.repository }}" {}

      - uses: actions/checkout@v4
        with:
          # Changesets needs full history to determine what changed
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo build

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          # When changesets exist → open/update "Version Packages" PR
          # When that PR is merged → publish to npm
          version: node scripts/calver-version.mjs
          publish: pnpm changeset publish
          title: "chore: release packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
